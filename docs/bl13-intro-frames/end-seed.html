<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  .stage {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 50%, #232a52 0%, #1B2140 55%, #12162e 100%);
  }
  svg { position: absolute; inset: 0; }
  .pulse {
    fill: none; stroke: #F2A63E; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 10px rgba(242,166,62,.9)) drop-shadow(0 0 26px rgba(242,166,62,.45));
    opacity: .9;
  }
  .halo { fill: #F2A63E; opacity: .3; filter: blur(8px); }
  .seed {
    fill: #F6EFE1;
    filter: drop-shadow(0 0 16px #F2A63E) drop-shadow(0 0 46px rgba(242,166,62,.85)) drop-shadow(0 0 88px rgba(242,166,62,.5));
  }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 1920 1080" width="1920" height="1080">
      <path class="pulse" d="M 0 540 L 720 540 L 810 540 L 860 205 L 910 540 L 1000 540 L 1920 540" />
      <circle class="halo" cx="860" cy="205" r="30" />
      <circle class="seed" cx="860" cy="205" r="9" />
    </svg>
  </div>
</body>
</html>
