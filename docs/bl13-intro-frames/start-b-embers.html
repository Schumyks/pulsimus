<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  .stage {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 50%, #232a52 0%, #1B2140 55%, #12162e 100%);
  }
  svg { position: absolute; inset: 0; }
  .pulse {
    fill: none; stroke: #F2A63E; stroke-width: 3; stroke-linecap: round;
    filter: drop-shadow(0 0 12px rgba(242,166,62,.95)) drop-shadow(0 0 34px rgba(242,166,62,.5));
    opacity: .8;
  }
  .embers circle { fill: #F2A63E; filter: blur(2px); }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 1920 1080" width="1920" height="1080">
      <g class="embers">
        <circle cx="360" cy="470" r="3" opacity=".45" />
        <circle cx="540" cy="610" r="2" opacity=".35" />
        <circle cx="760" cy="500" r="4" opacity=".5" />
        <circle cx="980" cy="600" r="2.5" opacity=".3" />
        <circle cx="1180" cy="470" r="3.5" opacity=".45" />
        <circle cx="1360" cy="590" r="2" opacity=".3" />
        <circle cx="1540" cy="510" r="3" opacity=".4" />
      </g>
      <path class="pulse" d="M 0 540 L 1920 540" />
    </svg>
  </div>
</body>
</html>
